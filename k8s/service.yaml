apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: %%NAMESPACE%%
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/managed-by: udap
  annotations:
    # NLB (Network Load Balancer) — required by the blueprint; provides a stable DNS name
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Route to node port 8080 (target port on the pod)
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
