apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: %%NAMESPACE%%
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/managed-by: udap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime: never remove a pod before the new one is ready
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: %%IMAGE%%
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: SPRING_DATASOURCE_URL
                  optional: true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: SPRING_DATASOURCE_USERNAME
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: SPRING_DATASOURCE_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              memory: "768Mi"     # CPU limit intentionally absent — JVM throughput throttles under CPU limits
          # livenessProbe: detects a wedged JVM and restarts the pod
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60   # JVM + Spring context startup
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # readinessProbe: gates traffic — pod only receives requests when DB is reachable
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]  # drain in-flight requests before shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
